  <div class="panel clock-panel" data-panel="clock">
    <div class="clock-face">
      <div class="clock-dial">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle class="clock-ring-track" cx="20" cy="20" r="17"/>
          <circle class="clock-ring-prog" id="clockRingH" cx="20" cy="20" r="17"
            transform="rotate(-90 20 20)"/>
        </svg>
        <span class="clock-dial-num" id="clockH">--</span>
      </div>
      <span class="clock-colon" aria-hidden="true">:</span>
      <div class="clock-dial">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle class="clock-ring-track" cx="20" cy="20" r="17"/>
          <circle class="clock-ring-prog" id="clockRingM" cx="20" cy="20" r="17"
            transform="rotate(-90 20 20)"/>
        </svg>
        <span class="clock-dial-num" id="clockM">--</span>
      </div>
      <span class="clock-colon" aria-hidden="true">:</span>
      <div class="clock-dial">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle class="clock-ring-track" cx="20" cy="20" r="17"/>
          <circle class="clock-ring-prog" id="clockRingS" cx="20" cy="20" r="17"
            transform="rotate(-90 20 20)"/>
        </svg>
        <span class="clock-dial-num" id="clockS">--</span>
      </div>
    </div>
    <div class="pomodoro-bar">
      <div class="pomodoro-label">Pomodoro</div>
      <div class="pomodoro-btns" id="pomodoroBtns"></div>
    </div>
  </div>
